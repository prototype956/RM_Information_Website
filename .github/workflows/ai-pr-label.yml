name: AI PR Risk Labels

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const matches = (pr.body || '').match(/(?:Closes|Fixes|Resolves)\s+#(\d+)/ig) || [];
            const issueNumber = matches[0]?.match(/#(\d+)/)?.[1];
            if (!issueNumber) return;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: Number(issueNumber) });
            const names = issue.labels.map(label => label.name).filter(name => /^(area|risk):/.test(name));
            if (names.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: names });
