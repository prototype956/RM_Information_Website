name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:cloud
      - run: npm run test:cloud
      - name: Setup reviewdog
        uses: reviewdog/action-setup@8d4df44bd05f29840e4fd1e27aaff1f99b6aaf82
        with:
          reviewdog_version: v0.20.3
      - name: Review whitespace diagnostics
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git diff --check HEAD^1 HEAD | reviewdog -name=git-diff-check -reporter=github-pr-check -fail-level=error -efm='%f:%l: %m'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr-ci-dist-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: ignore
          retention-days: 7

  ui:
    if: contains(github.event.pull_request.labels.*.name, 'area:ui') || contains(github.event.pull_request.labels.*.name, 'area:roadmap')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:roadmaps
      - run: npm run test:taxonomy
      - run: npm run test:requests
