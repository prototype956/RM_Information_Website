name: AI Policy Tests

on:
  push:
    paths:
      - scripts/ai/**
      - tests/ai-policy.test.mjs
      - .github/ai-policy.yml
  pull_request:
    paths:
      - scripts/ai/**
      - tests/ai-policy.test.mjs
      - .github/ai-policy.yml

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node --test tests/ai-policy.test.mjs
