name: AI Low Risk Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  merge:
    if: github.event_name != 'check_suite' || github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- ai-auto-merge -->';
            const prNumber = context.payload.pull_request?.number || context.payload.check_suite?.pull_requests?.[0]?.number;
            if (!prNumber) return;
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const labels = pr.labels.map(label => label.name);
            const reasons = [];
            if (pr.draft) reasons.push('PR 仍是 draft');
            if (pr.head.repo?.full_name !== owner + '/' + repo) reasons.push('head 仓库不是本仓库');
            if (!labels.includes('risk:low')) reasons.push('缺少 risk:low');
            if (!labels.includes('ai:reviewed')) reasons.push('缺少 ai:reviewed');
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
            const l0 = file => (file.endsWith('.css') && file.startsWith('src/')) || file.startsWith('src/components/ui/');
            if (files.length > 12) reasons.push('修改文件超过 12 个');
            if (files.reduce((sum, file) => sum + file.additions, 0) > 500) reasons.push('新增行超过 500');
            if (files.some(file => !l0(file.filename))) reasons.push('存在 L0 以外的文件');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 });
            if ([...comments, ...reviews].some(item => /\\bP[01]\\b|BLOCKING/i.test(item.body || item.state || ''))) reasons.push('存在 P0/P1 或阻断性 Review');
            const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
            if (checks.check_runs.some(check => !['success', 'neutral', 'skipped'].includes(check.conclusion))) reasons.push('确定性检查未全部通过');
            if (!checks.check_runs.length) reasons.push('尚未收到 CI 检查结果');
            const linked = (pr.body || '').match(/(?:Closes|Fixes|Resolves)\\s+#(\\d+)/ig) || [];
            if (!linked.length) reasons.push('PR 没有关联 Issue');
            if (reasons.length) {
              const body = marker + '\\n自动合并暂缓：' + reasons.join('；') + '。满足低风险策略和检查条件后会再次评估。';
              if (!comments.some(comment => (comment.body || '').includes(marker))) await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['ai:blocked'] }).catch(() => {});
              return;
            }
            await github.rest.pulls.merge({ owner, repo, pull_number: prNumber, merge_method: 'squash', commit_title: 'chore: squash low-risk AI change' });
