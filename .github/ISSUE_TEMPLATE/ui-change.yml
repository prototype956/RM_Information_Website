name: UI or interaction change
description: Request a focused visual or interaction change
title: "[UI] "
body:
  - type: input
    id: route
    attributes:
      label: Page or route
    validations:
      required: true
  - type: input
    id: control
    attributes:
      label: Target control or component
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include keyboard, mobile and reduced-motion expectations where relevant.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or reference
      description: Redact tokens and personal data.
