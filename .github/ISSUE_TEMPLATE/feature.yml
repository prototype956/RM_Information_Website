name: Feature request
description: Describe a user goal and a bounded feature
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: User goal
      description: Who needs this and what outcome should they get?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - roadmap
        - backend
        - data
        - release
    validations:
      required: true
